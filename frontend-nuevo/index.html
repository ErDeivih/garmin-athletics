<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E13" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lyfta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Lyfta: entrenamiento de fuerza y análisis de tu actividad." />
    <title>Lyfta</title>
    <script>
      // Aplica el tema guardado antes de que cargue el bundle: sin destello.
      try {
        const tema = localStorage.getItem('lyfta.theme')
          ?? localStorage.getItem('carga.theme')
          ?? localStorage.getItem('pulso.theme');
        if (tema === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (error) {
        // sin almacenamiento: se queda el tema oscuro por defecto
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
