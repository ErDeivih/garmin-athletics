<!-- @dsCard group="Data" height=200 subtitle="Héroe y secundaria, con y sin dato" -->
<!doctype html>
<html lang="es" data-theme="dark">
<head><meta charset="utf-8"><title>StatCard — preview</title></head>
<body>
  <div class="ga-grid">
    <article class="ga-stat ga-stat--hero">
      <span class="ga-stat__label">Disposición</span>
      <div class="ga-stat__figure">
        <span class="ga-stat__value">74</span>
        <span class="ga-stat__unit">/ 100</span>
      </div>
      <span class="ga-stat__delta ga-stat__delta--up">VERDE · +6 desde ayer</span>
      <span class="ga-stat__foot">Sueño 82 · HRV 61 ms · TSB -4</span>
    </article>
    <article class="ga-stat">
      <span class="ga-stat__label">Sueño</span>
      <div class="ga-stat__figure">
        <span class="ga-stat__value">7,4</span>
        <span class="ga-stat__unit">h</span>
      </div>
      <span class="ga-stat__delta">7 d: 7,1 h</span>
      <span class="ga-stat__foot">Eficiencia 91 % · 23:12 → 06:41</span>
    </article>
    <article class="ga-stat">
      <span class="ga-stat__label">FC en reposo</span>
      <div class="ga-stat__figure">
        <span class="ga-stat__value">—</span>
        <span class="ga-stat__unit">sin dato</span>
      </div>
      <span class="ga-stat__foot">La última sincronización no trajo FC de reposo.</span>
    </article>
  </div>
</body>
</html>
